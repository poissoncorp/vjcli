[project]
name = "vjctl"
version = "0.1.0"
description = "Terminal-native VJ control instrument for Ghostty."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vjctl = "vjctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vjctl = ["fonts/*.flf"]
